name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract project
        run: |
          mkdir project
          tar -xzf project_*.tar.gz -C project --strip-components=1
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install pnpm
        run: npm install -g pnpm
        
      - name: Install dependencies
        working-directory: project
        run: pnpm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. 先运行 prebuild 生成 android 目录
      - name: Generate Android project
        working-directory: project/client
        run: npx expo prebuild --platform android

      # 2. 然后生成签名，并放进刚生成的目录里
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"
          mv my-release-key.keystore project/client/android/app/
        
      # 3. 最后执行构建
      - name: Build APK
        working-directory: project/client/android
        run: ./gradlew assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: project/client/android/app/build/outputs/apk/release/*.apk
