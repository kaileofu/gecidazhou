name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract project
        run: |
          mkdir project
          tar -xzf project_*.tar.gz -C project
          mv project/projects/* project/
          rm -rf project/projects
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install pnpm
        run: npm install -g pnpm
        
      - name: Install dependencies
        working-directory: project
        run: pnpm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android project
        working-directory: project/client
        run: npx expo prebuild --platform android

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"
          mv my-release-key.keystore project/client/android/app/

      # ⚠️ 关键步骤：强制允许 Gradle 生成 APK
      - name: Enable APK output in gradle.properties
        run: |
          echo "android.enableApk=true" >> project/client/android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> project/client/android/gradle.properties
        
      - name: Build APK
        working-directory: project/client/android
        run: |
          ./gradlew assembleRelease -x lint 2>&1 | tee /tmp/build.log
          
          if grep -q -i "error" /tmp/build.log; then
            echo "=== FOUND ERROR ==="
            grep -n -i "error\|failed\|exception" /tmp/build.log | head -50
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            project/**/build/outputs/**/*
